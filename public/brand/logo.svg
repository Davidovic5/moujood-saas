<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="url(#darkBg)" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Geometric Pulse Rings -->
  <circle cx="100" cy="94" r="54" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />
  <circle cx="100" cy="94" r="38" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.2" />

  <!-- Central Location Pin & Pulse -->
  <path d="M100 50 C80.67 50 65 65.67 65 85 C65 108.5 94 135 97.5 138.1 C98.9 139.3 101.1 139.3 102.5 138.1 C106 135 135 108.5 135 85 C135 65.67 119.33 50 100 50 Z" 
        fill="url(#brandGrad)" filter="url(#glow)"/>

  <!-- Inner Core Cutout -->
  <circle cx="100" cy="84" r="14" fill="#09090B" />
  <circle cx="100" cy="84" r="6" fill="url(#brandGrad)" />

  <!-- Base Ground Reflection Arc -->
  <path d="M60 162 C72 168 128 168 140 162" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
